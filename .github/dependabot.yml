version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Minor and patch updates are batched into one PR to keep the noise down.
    # Majors are left ungrouped so each gets its own PR and can be reviewed,
    # and if needed held back, on its own.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # typescript-eslint (via eslint-config-phun-ky) peers on typescript <6.1.
      # Remove once it supports TypeScript 7 (#153).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # CI runs Node 24, so the Node types stay on 24
      - dependency-name: '@types/node'
        versions: ['>=25']
    schedule:
      interval: 'weekly'
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
  - package-ecosystem: 'github-actions'
    directory: '/'
    # Same grouping as npm: minor and patch together, each major on its own.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
