name: Checks

on:
  push:
    branches: ['main']
    paths: &check-paths
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.js'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - 'custom-typedoc-plugin.js'
      - '**/*.md'
      - '.github/workflows/check.yml'
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    paths: *check-paths
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run style:lint
      - name: Build
        run: npm run build
      - name: Import built entry point
        run: node --input-type=module -e "import * as m from './dist/typeof.js'; if (typeof m.isString !== 'function') throw new Error('isString missing from dist/typeof.js');"
      - name: Test
        run: npm run test:ci
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/typeof
  notify:
    name: Notify failed check
    needs: check
    # Dependabot runs get no secrets, so GH_TOKEN is empty there
    if: failure() && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: drivendataorg/failed-build-issue-action@v1
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          label-name: 'problems: 💔 build failed'
