name: Checks

on:
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.js'
      - 'scripts/**'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - 'custom-typedoc-plugin.js'
      - '**/*.md'
      - '.github/**'
      - 'typedoc.json'
      - '.release-it.json'
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
    # No paths filter here: check is a required status, so it has to run on
    # every PR or a PR touching only unlisted files could never merge.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run style:lint
      - name: Build
        run: npm run build
      - name: Check package # Packs, installs and imports the package from every entry point
        run: npm run check:pack
      - name: Test
        run: npm run test:ci
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/typeof
  notify:
    name: Notify failed check
    needs: check
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
          # Don't recreate a missing label under another name
          create-label: false
