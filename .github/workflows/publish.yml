name: Publish

on:
  pull_request:
    types: [closed]
    branches: ['main']
    # Only files that can change what gets released
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'LICENSE'
      - 'rollup.config.js'
      - 'tsconfig.json'
      - '.release-it.json'
      - '.github/scripts/should-release.sh'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write # For git operations
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # The release guard and changelog need all tags and history
          token: ${{ secrets.GH_TOKEN }}
      # Node 24 ships npm 11, which supports trusted publishing (needs >= 11.5.1).
      # Don't upgrade to npm@latest: npm 12 blocks dependency install scripts by default.
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check for releasable changes
        id: guard
        run: bash .github/scripts/should-release.sh
      - name: Release
        if: steps.guard.outputs.release == 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          npm run release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
  notify:
    name: Notify failed build
    needs: publish
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: drivendataorg/failed-build-issue-action@v1
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          label-name: 'problems: 💔 build failed'
