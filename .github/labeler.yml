'section: workflows':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - .github/workflows/**
'section: repo':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '*'
'section: tests':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'src/**/__tests__/**'
'experience: developer':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '.editorconfig'
              - 'eslint.config.mjs'
              - '.gitignore'
              - '.release-it.json'
              - '.prettierrc'
              - '.putout.json'
              - 'tsconfig.json'
              - 'typedoc.json'
'context: github':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - .github/**
'context: rollup':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'rollup.config.js'
'mindless: ✏️ docs':
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.md'
'mindless: 📦 dependencies':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'package-lock.json'

# Branch prefixes, anchored with the slash so docs/fix-... is not a bug
'✨ feature':
  - head-branch: ['^feat/']
'problems: 🐛 bug':
  - head-branch: ['^fix/']
'mindless: 🤖 chore':
  - head-branch: ['^chore/', '^ci/']
'improvements: 💡 enhancement':
  - head-branch: ['^improvements/']
